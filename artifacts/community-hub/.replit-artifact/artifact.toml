kind = "web"
previewPath = "/"
title = "CommUnity Hub"
version = "1.0.0"
id = "artifacts/community-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20674

[services.development]
run = "pnpm --filter @workspace/community-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/community-hub", "run", "build" ]
publicDir = "artifacts/community-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20674"
BASE_PATH = "/"
